[workspace]
resolver = "2"
members = [
    "crates/witchat-protocol",
    "crates/witchat-crypto",
    "crates/witchat-core",
    "crates/witchat-ble",
    "crates/witchat-nostr",
    "crates/witchat-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/witchat/witchat"
rust-version = "1.90"

[workspace.dependencies]
witchat-protocol = { path = "crates/witchat-protocol" }
witchat-crypto = { path = "crates/witchat-crypto" }
witchat-core = { path = "crates/witchat-core" }
witchat-ble = { path = "crates/witchat-ble" }
witchat-nostr = { path = "crates/witchat-nostr" }

anyhow = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
snow = { version = "0.9", features = ["risky-raw-split"] }
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
btleplug = "0.11"
uuid-ble = { package = "uuid", version = "1" }
futures = "0.3"
iced = { version = "0.13", features = ["tokio", "debug", "image", "canvas"] }
chrono = { version = "0.4", features = ["clock"] }
nostr-sdk = "0.45"
# nostr-sdk's own event types; named for `Keys::generate` (os-rng) and NIP-13 mining.
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }
# The curve under nostr keys, for the envelope's ECDH point (same 0.30 as nostr's).
secp256k1 = { version = "0.30", default-features = false, features = ["std"] }
# Already linked through nostr-sdk's websocket stack; named here for the
# relay-directory download (same TLS backend and roots as the relays).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
webpki-roots = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
qrcode = { version = "0.14", default-features = false }
# Decodes a saved QR picture; ISC parts (from quirc) like ring/untrusted.
rqrr = { version = "0.11", default-features = false }
# Same major as iced's, so no second copy is built.
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
# Notification-area icon. Linux uses the ksni (D-Bus) backend, not GTK.
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Geolocation",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Playback",
    "Storage",
    "Storage_Search",
    "Storage_Streams",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
